<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Linux Monitor{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="brand-text">
          <strong>Linux Monitor</strong>
          <span class="brand-sub">Infrastructure Demo</span>
        </div>
      </div>
      <nav class="app-nav" aria-label="Primary">
        {% block nav %}{% endblock %}
      </nav>
      {% block flash_global %}{% endblock %}
      <!-- nav links styled in style.css -->
    </header>

    <main class="app-main">
      {% block content %}{% endblock %}
    </main>

    <footer class="app-footer">
      <span>Local demo · Read-only monitoring</span>
    </footer>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
